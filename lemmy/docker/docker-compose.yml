x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "4"

# Everything below runs on the host's own architecture by default. Export
# LEMMY_IMAGE_PLATFORM=linux/amd64 (or linux/arm64) before `docker compose up` to run the
# whole stack under emulation instead - useful on Apple Silicon when an image has no arm64
# build, or to reproduce a report that only happens on x86_64. An empty value drops the key
# entirely, which is what compose wants for "use the native platform".
x-image-platform: &image-platform ${LEMMY_IMAGE_PLATFORM:-}

services:
  proxy:
    image: nginx:1-alpine
    platform: *image-platform
    ports:
      # actual and only port facing any connection from outside
      # Note, change the left number if port 1236 is already in use on your system
      # You could use port 80 if you won't use a reverse proxy
      - "1236:1236"
      - "8536:8536"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,Z
    restart: unless-stopped
    depends_on:
      lemmy:
        condition: service_healthy
      lemmy-ui:
        condition: service_healthy
      pictrs:
        condition: service_healthy
    healthcheck:
      # busybox wget is in the alpine image; check the public port the proxy actually serves.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1236/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  lemmy:
    platform: *image-platform
    build:
      context: ../
      dockerfile: docker/Dockerfile
    hostname: lemmy
    restart: unless-stopped
    environment:
      - RUST_LOG=warn,extism=info,lemmy_server=debug,lemmy_api=debug,lemmy_api_common=debug,lemmy_api_crud=debug,lemmy_apub=debug,lemmy_db_schema=debug,lemmy_db_views=debug,lemmy_routes=debug,lemmy_utils=debug,lemmy_websocket=debug
      - LEMMY_DISABLE_ACTIVITY_SENDING=true
    volumes:
      - ./lemmy.hjson:/config/config.hjson:Z
      - ./plugins:/plugins:Z
    depends_on:
      postgres:
        condition: service_healthy
      pictrs:
        condition: service_healthy
    healthcheck:
      # The runner image installs curl. /api/v3/site only answers 200 once the migrations
      # have run, so this doubles as the "database is usable" check for everything downstream.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8536/api/v3/site"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging: *default-logging

  lemmy-ui:
    platform: *image-platform
    # Build the local lemmy-ui checkout so frontend changes are included.
    # Use the image below instead when a prebuilt UI is preferred.
    # image: dessalines/lemmy-ui:nightly
    build:
      context: ../../lemmy-ui
      dockerfile: dev.dockerfile
    environment:
      # LEMMY_UI_BACKEND is the url the *browser* uses, so it has to be reachable from the
      # browser - the compose-internal `lemmy:8536` cannot be resolved there, which made every
      # client-side request fail with "Failed to fetch" (logins, votes, posting). Point it at
      # the proxy on the same origin as the ui, then set LEMMY_UI_PUBLIC_URL when the ui is
      # reached somewhere else, e.g.
      #   LEMMY_UI_PUBLIC_URL=https://niuma.club docker compose up -d
      - LEMMY_UI_BACKEND=${LEMMY_UI_PUBLIC_URL:-localhost:1236}
      # server-side rendering talks to the backend over the compose network
      - LEMMY_UI_BACKEND_INTERNAL=lemmy:8536
      # used for share/copy-post links; without it the request host is the internal
      # `lemmy-ui` hostname behind the proxy
      - LEMMY_UI_FRONTEND=${LEMMY_UI_PUBLIC_URL:-localhost:1236}
      # optional: uri for security reports, e.g. mailto:you@example.org. Unset means
      # /.well-known/security.txt carries no Contact field.
      - LEMMY_UI_SECURITY_CONTACT=${LEMMY_UI_SECURITY_CONTACT:-}
      # set the outside hostname here
      - LEMMY_UI_HTTPS=false
      - LEMMY_UI_ERUDA=true
    depends_on:
      lemmy:
        condition: service_healthy
    healthcheck:
      # busybox wget again; the dev server answers on every path.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1234/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    init: true

  pictrs:
    image: asonix/pictrs:0.5
    platform: *image-platform
    # this needs to match the pictrs url in lemmy.hjson
    hostname: pictrs
    # we can set options to pictrs like this, here we set max. image size and forced format for conversion
    # entrypoint: /sbin/tini -- /usr/local/bin/pict-rs -p /mnt -m 4 --image-format webp
    environment:
      - PICTRS_OPENTELEMETRY_URL=http://otel:4137
      - PICTRS__SERVER__API_KEY=my-pictrs-key
      - PICTRS__MEDIA__VIDEO_CODEC=vp9
      - PICTRS__MEDIA__GIF__MAX_WIDTH=256
      - PICTRS__MEDIA__GIF__MAX_HEIGHT=256
      - PICTRS__MEDIA__GIF__MAX_AREA=65536
      - PICTRS__MEDIA__GIF__MAX_FRAME_COUNT=400
    user: 991:991
    volumes:
      - ./volumes/pictrs:/mnt:Z
    healthcheck:
      # pict-rs serves /healthz; the image ships wget.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    platform: *image-platform
    # this needs to match the database host in lemmy.hson
    # Tune your settings via
    # https://pgtune.leopard.in.ua/#/
    # You can use this technique to add them here
    # https://stackoverflow.com/a/30850095/1655478
    hostname: postgres
    command: postgres -c config_file=/etc/postgresql.conf
    ports:
      # use a different port so it doesn't conflict with potential postgres db running on the host
      - "5433:5432"
    environment:
      - POSTGRES_USER=lemmy
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=lemmy
    volumes:
      - ./volumes/postgres:/var/lib/postgresql:Z
      - ./customPostgresql.conf:/etc/postgresql.conf:Z
    healthcheck:
      # Keep the image's own check (it also waits for a pending major-version upgrade to
      # finish) and only tighten the timing, so `up` doesn't idle for the default 30s.
      test: ["CMD-SHELL", "/usr/local/bin/pgautoupgrade-healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
